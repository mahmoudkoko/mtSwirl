workflow-log-dir = "cromwell-workflow-logs"

backend.providers.Local.config.root = "cromwell-executions"
backend.providers.Local.config.concurrent-job-limit = 1
backend.providers.Local.config.submit = "bash ${script}"
backend.providers.Local.config.submit-docker = """
  rm -f ${docker_cid}
  docker run \
    --network none \
    --hostname localhost \
    --cidfile ${docker_cid} \
    -i \
    ${"--user " + docker_user} \
    --entrypoint ${job_shell} \
    -v ${cwd}:${docker_cwd}:delegated \
    ${docker} ${docker_script}
  rc=$(docker wait `cat ${docker_cid}`)
  docker rm `cat ${docker_cid}`
  exit $rc
"""
